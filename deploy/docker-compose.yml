version: "3.9"
git config --global core.autocrlf

services:
    # PHP & Laravel
    app:
        build:
            context: ./docker/php
        container_name: ticketing_app
        restart: unless-stopped
        working_dir: /var/www/html
        volumes:
            - ../:/var/www/html
        depends_on:
            - db
            - redis
        environment:
            - DB_CONNECTION=pgsql
            - DB_HOST=db
            - DB_PORT=5432
            - DB_DATABASE=ticketing_db
            - DB_USERNAME=postgres
            - DB_PASSWORD=postgres
            - QUEUE_CONNECTION=redis
            - REDIS_HOST=redis
            - APP_ENV=local
            - APP_DEBUG=true
            - APP_KEY=
        networks:
            - ticketnet

    # Nginx Web Server
    nginx:
        image: nginx:alpine
        container_name: ticketing_nginx
        restart: unless-stopped
        ports:
            - "81:80"
        volumes:
            - ../:/var/www/html
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app
        networks:
            - ticketnet

    # PostgreSQL Database
    db:
        image: postgres:15
        container_name: ticketing_db
        restart: unless-stopped
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: ticketing_db
        ports:
            - "5432:5432"
        # volumes:
        #   - pgdata:/var/lib/postgresql/data
        networks:
            - ticketnet

    # Redis
    redis:
        image: redis:alpine
        container_name: ticketing_redis
        restart: unless-stopped
        ports:
            - "6379:6379"
        networks:
            - ticketnet

    # Queue Worker
    queue:
        build:
            context: ./docker/php
        container_name: ticketing_queue
        command: php artisan queue:work --verbose --tries=3 --timeout=90
        working_dir: /var/www/html
        volumes:
            - ../:/var/www/html
        depends_on:
            - app
            - redis
        networks:
            - ticketnet

volumes:
    pgdata:

networks:
    ticketnet:
        driver: bridge
